[project]
name = "wave-agent"
version = "0.1.0"
description = "Evidence-aware agent operating system MVP"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.9", "sqlalchemy>=2.0", "httpx>=0.27", "psycopg[binary]>=3.2", "python-dotenv>=1.0"]
[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["apps*", "core*", "models*", "robots*", "training*"]

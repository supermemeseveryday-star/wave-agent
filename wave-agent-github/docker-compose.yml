services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: wave
      POSTGRES_USER: wave
      POSTGRES_PASSWORD: wave_dev_only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["wave_pg:/var/lib/postgresql/data", "./scripts/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wave"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://wave:wave_dev_only@postgres:5432/wave
      MODEL_PROVIDER: ollama
      MODEL_BASE_URL: http://host.docker.internal:11434
      MODEL_NAME: qwen3.8:27b-mtp-q4_K_M
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  wave_pg:
